{% extends "base.html" %} {% block title %}Request a Quote | ColorCraft Paints{% endblock %} {% block content %}
<div class="page-header">
  <div class="container">
    <h1>Request a Quote</h1>
    <p>Tell us what you need.</p>
  </div>
</div>
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <form method="post" class="card border-0 shadow-sm p-4 p-md-5">
        {% csrf_token %} {% for field in form %}
        <div class="mb-3">
          <label class="form-label fw-semibold">{{ field.label }}</label>{{
          field }}{% for error in field.errors %}
          <div class="text-danger small">{{ error }}</div>
          {% endfor %}
        </div>
        {% endfor %}
        <button class="btn btn-brand btn-lg w-100">Submit Quote Request</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
